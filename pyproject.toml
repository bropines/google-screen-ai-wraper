[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-screen-ai-wraper"
version = "1.0.0"
description = "Lightweight Python wrapper and CLI for Google's on-device ScreenAI OCR and Main Content Extraction library."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Bropines", email = "bropines@gmail.com"}
]
keywords = ["screen-ai", "ocr", "google", "text-recognition", "sharex", "content-extraction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "protobuf>=4.0.0",
    "Pillow>=9.0.0"
]

[project.optional-dependencies]
clipboard = [
    "pyperclip>=1.8"
]

[project.scripts]
screen-ai = "google_screen_ai.__main__:main"

[project.urls]
Homepage = "https://github.com/bropines/google-screen-ai-wraper"
Repository = "https://github.com/bropines/google-screen-ai-wraper.git"
