[metadata]
name = google-screen-ai-wraper
version = 1.0.0
author = Bropines
author_email = bropines@gmail.com
description = Lightweight Python wrapper and CLI for Google's on-device ScreenAI OCR and Main Content Extraction library.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/bropines/google-screen-ai-wraper
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Image Recognition
    Topic :: Software Development :: Libraries :: Python Modules
    Intended Audience :: Developers

[options]
packages = find:
python_requires = >=3.8
install_requires =
    protobuf >= 4.0.0
    Pillow >= 9.0.0

[options.packages.find]
exclude =
    tests*

[options.entry_points]
console_scripts =
    screen-ai = google_screen_ai.__main__:main

[options.extras_require]
clipboard =
    pyperclip >= 1.8
